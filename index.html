<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ULTRA BINGO - እውነተኛ ገንዘብ</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body { background: #0a0a1a; color: #f0f0ff; font-family: Arial, sans-serif; min-height: 100vh; }
    .container { max-width: 800px; margin: 0 auto; padding: 20px; }
    .glass { background: rgba(17, 17, 40, 0.9); backdrop-filter: blur(4px); border-radius: 24px; padding: 20px; margin-bottom: 20px; border: 1px solid #2a2a4e; }
    .btn { background: linear-gradient(135deg, #FFD966, #FFAA33); border: none; border-radius: 40px; padding: 12px 24px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; font-size: 1rem; }
    .btn-outline { background: transparent; border: 1px solid #FFD966; color: #FFD966; }
    .input { background: #1a1a36; border: 1px solid #2a2a4e; border-radius: 40px; padding: 12px 16px; width: 100%; color: white; margin: 8px 0; font-size: 1rem; outline: none; }
    .board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; background: #0f0f20; border-radius: 24px; padding: 15px; }
    .cell { aspect-ratio: 1; background: #1a1a36; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.9rem; border: 1px solid #2a2a4e; cursor: pointer; transition: 0.1s; }
    .cell.marked { background: linear-gradient(145deg, #FFD966, #FFAA33); color: #1e1a00; border-color: #FFD966; }
    .cell.free { background: #2ecc7122; border-color: #2ecc71; color: #2ecc71; }
    .players-list { display: flex; flex-wrap: wrap; gap: 10px; margin: 15px 0; }
    .player-badge { background: #2a2a4e; border-radius: 40px; padding: 5px 15px; font-size: 0.8rem; }
    .player-badge.me { background: #FFD966; color: black; }
    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1e1e3a; padding: 10px 20px; border-radius: 40px; opacity: 0; transition: 0.2s; pointer-events: none; z-index: 1000; }
    .toast.show { opacity: 1; }
    .history { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
    .hist-item { background: #1e1e3a; border-radius: 20px; padding: 5px 10px; font-size: 0.7rem; }
    .hist-item.latest { background: #FFD966; color: black; }
    .hidden { display: none; }
    .status-bar { display: flex; justify-content: space-between; background: #111128; border-radius: 40px; padding: 10px 16px; margin-bottom: 15px; }
    .tab { display: flex; gap: 10px; margin-bottom: 15px; }
    .tab button { flex: 1; background: #2a2a4e; border: none; border-radius: 30px; padding: 10px; color: white; cursor: pointer; }
    .tab button.active { background: #FFD966; color: black; }
    .deposit-info { background: #1a1a36; border-radius: 16px; padding: 15px; margin: 10px 0; text-align: center; }
    .deposit-info .phone { font-size: 1.3rem; font-weight: bold; color: #FFD966; letter-spacing: 1px; }
    .balance-display { font-size: 1.5rem; font-weight: bold; color: #FFD966; text-align: center; margin-bottom: 10px; }
  </style>
</head>
<body>
<div class="container">
  <!-- የመግቢያ ገጽ (ምዝገባ) -->
  <div id="registerScreen">
    <div style="text-align:center; margin: 30px 0;">
      <h1>🎯 ULTRA BINGO</h1>
      <p>2 መስመር = ድል | እውነተኛ ገንዘብ</p>
    </div>
    <div class="glass">
      <input type="text" id="regName" class="input" placeholder="ሙሉ ስም">
      <input type="tel" id="regPhone" class="input" placeholder="ስልክ ቁጥር 09xxxxxxxx">
      <input type="text" id="regRefCode" class="input" placeholder="የማጣቀሻ ኮድ (ካለ)">
      <button class="btn" id="registerBtn">📱 ተመዝገብ + 10 ብር ቦነስ</button>
      <button class="btn btn-outline" id="demoBtn">🎮 ያለ ምዝገባ ይሞክሩ</button>
    </div>
  </div>

  <!-- ዋና መተግበሪያ -->
  <div id="mainApp" class="hidden">
    <div class="tab">
      <button id="tabLobbyBtn" class="active">🏠 ሎቢ</button>
      <button id="tabWalletBtn">💰 ሂሳብ</button>
      <button id="tabAdminBtn" class="btn-outline" style="display:none;">👑 አስተዳዳሪ</button>
    </div>
    
    <!-- ሎቢ ገጽ -->
    <div id="lobbyView">
      <div class="glass">
        <div class="balance-display" id="balanceDisplay">0 ብር</div>
        <div id="userInfo"></div>
      </div>
      <div class="glass">
        <h3>🎮 ክፍል ይምረጡ</h3>
        <input type="text" id="roomIdInput" class="input" placeholder="የክፍል ኮድ (ለመቀላቀል)">
        <button class="btn" id="createRoomBtn">✨ አዲስ ክፍል ፍጠሩ</button>
        <button class="btn btn-outline" id="joinRoomBtn">🔗 ክፍል ይቀላቀሉ</button>
      </div>
    </div>
    
    <!-- ሂሳብ ገጽ (ዲፖዚት / ዊዝድሮ) -->
    <div id="walletView" class="hidden">
      <div class="glass">
        <div class="balance-display" id="walletBalance">0 ብር</div>
        <div id="refCodeDisplay" style="text-align:center; margin:10px 0;"></div>
      </div>
      <div class="glass">
        <h3>📥 ዲፖዚት ማድረግ</h3>
        <div class="deposit-info">
          <div>📱 ገንዘብ ወደዚህ ቁጥር ላኩ</div>
          <div class="phone">0953025980</div>
          <div>ስም: <strong>Seid</strong></div>
          <div style="font-size:0.7rem; margin-top:8px;">ከ100 እስከ 10,000 ብር</div>
        </div>
        <input type="number" id="depositAmount" class="input" placeholder="መጠን (ብር)">
        <input type="text" id="depositRef" class="input" placeholder="የቴሌብር ማጣቀሻ ቁጥር">
        <button class="btn" id="depositBtn">💰 ዲፖዚት ጥያቄ አስገባ</button>
      </div>
      <div class="glass">
        <h3>📤 ገንዘብ ማውጣት</h3>
        <input type="number" id="withdrawAmount" class="input" placeholder="መጠን (ብር)">
        <input type="tel" id="withdrawPhone" class="input" placeholder="የሚወጣበት ስልክ ቁጥር">
        <input type="password" id="withdrawPin" class="input" placeholder="የደህንነት ፒን (1234)" value="1234">
        <button class="btn" id="withdrawBtn">💸 ዊዝድሮ ጥያቄ አስገባ</button>
      </div>
    </div>

    <!-- አስተዳዳሪ ፓነል -->
    <div id="adminView" class="hidden">
      <div class="glass">
        <h3>👑 ዲፖዚት ማረጋገጫ</h3>
        <input type="password" id="adminKeyInput" class="input" placeholder="Admin Key">
        <button class="btn" id="adminLoginBtn">🔓 ግባ</button>
        <div id="pendingDepositsList"></div>
      </div>
    </div>
  </div>

  <!-- ክፍል ሎቢ -->
  <div id="roomLobbyScreen" class="hidden">
    <div class="glass">
      <h3>🏠 ክፍል ሎቢ - <span id="roomIdDisplay"></span></h3>
      <div class="players-list" id="playersList"></div>
      <button class="btn" id="startGameBtn" style="display:none;">🎮 ጨዋታ ጀምር</button>
      <button class="btn btn-outline" id="leaveLobbyBtn">🚪 ውጣ</button>
    </div>
  </div>

  <!-- ጨዋታ ገጽ -->
  <div id="gameScreen" class="hidden">
    <div class="status-bar">
      <div>📊 ነጥብ <strong id="score">0</strong></div>
      <div>🎯 ቢንጎ <strong id="bingoCount">0/2</strong></div>
      <div>🔢 <span id="calledTotal">0</span>/75</div>
    </div>
    <div class="glass">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div style="font-size: 2rem;" id="lastLetter">—</div>
        <div style="font-size: 2rem; font-weight: bold;" id="lastNum">—</div>
        <button id="autoMarkBtn" class="btn" style="width: auto; padding: 5px 15px;">✅ አውቶ</button>
      </div>
      <div class="history" id="historyDiv"></div>
    </div>
    <div id="bingoBoard" class="board"></div>
    <div class="players-list" id="gamePlayersList"></div>
    <button class="btn" id="claimBingoBtn">🏆 BINGO!</button>
    <button class="btn btn-outline" id="leaveGameBtn">🚪 ውጣ</button>
  </div>
</div>
<div id="toastMsg" class="toast"></div>

<script>
  let socket = null;
  let currentUser = null;
  let currentRoomId = null;
  let isHost = false;
  let gameActive = false;
  let cardMatrix = [];
  let marked = Array(5).fill().map(() => Array(5).fill(false));
  let linesCompleted = 0;
  let autoMark = true;
  let calledNumbers = [];

  function toast(msg) {
    const t = document.getElementById("toastMsg");
    t.innerText = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 3000);
  }

  function updateBalanceUI() {
    if (currentUser) {
      document.getElementById("balanceDisplay").innerText = currentUser.balance.toFixed(2) + " ብር";
      document.getElementById("walletBalance").innerText = currentUser.balance.toFixed(2) + " ብር";
      document.getElementById("refCodeDisplay").innerHTML = `🔑 የማጣቀሻ ኮድ: <strong>${currentUser.refCode}</strong> <span style="cursor:pointer;" onclick="copyRefCode()">📋 ቅዳ</span>`;
      document.getElementById("userInfo").innerHTML = `👋 እንኳን ደህና መጣህ, ${currentUser.name}! 🏆 ድሎች: ${currentUser.wins || 0}`;
    }
  }

  window.copyRefCode = () => {
    if (currentUser) { navigator.clipboard.writeText(currentUser.refCode); toast("ኮድ ተቀድቷል"); }
  };

  async function register(name, phone, refCode) {
    const res = await fetch('/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, phone, refCode }) });
    return await res.json();
  }

  async function deposit(phone, amount, reference) {
    const res = await fetch('/api/deposit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone, amount, reference }) });
    return await res.json();
  }

  async function withdraw(phone, amount, pin, withdrawPhone) {
    const res = await fetch('/api/withdraw', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone, amount, pin, withdrawPhone }) });
    return await res.json();
  }

  async function getUser(phone) {
    const res = await fetch(`/api/user/${phone}`);
    return await res.json();
  }

  async function getPendingDeposits(adminKey) {
    const res = await fetch(`/api/pending-deposits?adminKey=${adminKey}`);
    return await res.json();
  }

  async function verifyDeposit(depositId, adminKey) {
    const res = await fetch('/api/verify-deposit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ depositId, adminKey }) });
    return await res.json();
  }

  function renderBoard() {
    const boardDiv = document.getElementById("bingoBoard");
    if (!boardDiv) return;
    boardDiv.innerHTML = "";
    for (let row = 0; row < 5; row++) {
      for (let col = 0; col < 5; col++) {
        const isFree = (row === 2 && col === 2);
        const num = isFree ? "FREE" : cardMatrix[col][row];
        const isMarked = marked[row][col];
        const cell = document.createElement("div");
        cell.className = "cell";
        if (isFree) cell.classList.add("free");
        if (isMarked && !isFree) cell.classList.add("marked");
        cell.innerText = num;
        if (!isFree && !autoMark) {
          cell.onclick = () => {
            if (calledNumbers.includes(num)) {
              socket.emit('markNumber', { roomId: currentRoomId, row, col, number: num });
            } else toast("ቁጥሩ ገና አልወጣም");
          };
        }
        boardDiv.appendChild(cell);
      }
    }
  }

  function updateHistory(letter, num) {
    const histDiv = document.getElementById("historyDiv");
    const item = document.createElement("div");
    item.className = "hist-item";
    item.innerText = `${letter}${num}`;
    histDiv.prepend(item);
    if (histDiv.children.length > 12) histDiv.removeChild(histDiv.lastChild);
    if (histDiv.children[1]) histDiv.children[1].classList.remove("latest");
    item.classList.add("latest");
  }

  function setupSocket() {
    socket = io();
    socket.on('roomCreated', (data) => {
      currentRoomId = data.roomId; isHost = data.isHost;
      document.getElementById("roomIdDisplay").innerText = currentRoomId;
      document.getElementById("startGameBtn").style.display = isHost ? "block" : "none";
      document.getElementById("mainApp").classList.add("hidden");
      document.getElementById("roomLobbyScreen").classList.remove("hidden");
      toast(`ክፍል ተፈጥሯል! ኮድ: ${currentRoomId}`);
    });
    socket.on('roomJoined', (data) => {
      currentRoomId = data.roomId; isHost = data.isHost;
      document.getElementById("roomIdDisplay").innerText = currentRoomId;
      document.getElementById("startGameBtn").style.display = isHost ? "block" : "none";
      document.getElementById("mainApp").classList.add("hidden");
      document.getElementById("roomLobbyScreen").classList.remove("hidden");
      toast(`ክፍሉን ተቀላቅለዋል! ኮድ: ${currentRoomId}`);
    });
    socket.on('playersList', (players) => {
      const container = document.getElementById("playersList");
      container.innerHTML = players.map(p => `<div class="player-badge ${p.id === socket.id ? 'me' : ''}">${p.name}</div>`).join("");
      const gameContainer = document.getElementById("gamePlayersList");
      if (gameContainer) gameContainer.innerHTML = players.map(p => `<div class="player-badge ${p.id === socket.id ? 'me' : ''}">${p.name}</div>`).join("");
    });
    socket.on('cardData', (data) => {
      cardMatrix = data.card;
      marked = Array(5).fill().map(() => Array(5).fill(false));
      marked[2][2] = true;
      linesCompleted = 0;
      document.getElementById("bingoCount").innerText = "0/2";
      renderBoard();
    });
    socket.on('gameStarted', () => {
      gameActive = true; calledNumbers = [];
      document.getElementById("roomLobbyScreen").classList.add("hidden");
      document.getElementById("gameScreen").classList.remove("hidden");
      toast("ጨዋታ ተጀምሯል! እንኳን ደስ አለዎት!");
    });
    socket.on('numberCalled', (data) => {
      if (!gameActive) return;
      const { number, letter, calledCount } = data;
      document.getElementById("lastLetter").innerText = letter;
      document.getElementById("lastNum").innerText = number;
      updateHistory(letter, number);
      document.getElementById("calledTotal").innerText = calledCount;
      calledNumbers.push(number);
      if (autoMark) {
        let hit = false;
        for (let col = 0; col < 5; col++) {
          for (let row = 0; row < 5; row++) {
            if (cardMatrix[col][row] === number && !marked[row][col]) { marked[row][col] = true; hit = true; }
          }
        }
        if (hit) toast(`✅ ${letter}${number} በካርድህ ላይ!`);
        renderBoard();
      } else toast(`🔔 ${letter}${number}`);
    });
    socket.on('linesUpdate', (data) => {
      linesCompleted = data.lines;
      document.getElementById("bingoCount").innerText = `${linesCompleted}/2`;
      document.getElementById("score").innerText = linesCompleted * 500;
      if (linesCompleted >= 2 && gameActive) toast("እንኳን ደስ አለዎት! 2 መስመር ሞልቷል! ቢንጎ ተጫኑ!");
    });
    socket.on('gameEnded', (data) => {
      gameActive = false;
      if (data.winner && data.winner === currentUser?.name) {
        currentUser.wins = (currentUser.wins || 0) + 1;
        toast("🏆 አሸንፈዋል! እንኳን ደስ አለዎት!");
        canvasConfetti({ particleCount: 200, spread: 70 });
      } else if (data.winner) toast(`${data.winner} አሸንፈዋል!`);
      else toast("ጨዋታው አልቋል!");
      setTimeout(() => window.location.reload(), 4000);
    });
    socket.on('errorMessage', (data) => toast(data.message));
  }

  // ክስተቶች
  document.getElementById("registerBtn").onclick = async () => {
    const name = document.getElementById("regName").value.trim();
    const phone = document.getElementById("regPhone").value.trim();
    const refCode = document.getElementById("regRefCode").value.trim();
    if (!name || !phone) { toast("ስም እና ስልክ ያስፈልጋል"); return; }
    const result = await register(name, phone, refCode);
    if (result.success) {
      currentUser = result.user; currentUser.phone = phone;
      updateBalanceUI(); setupSocket();
      document.getElementById("registerScreen").classList.add("hidden");
      document.getElementById("mainApp").classList.remove("hidden");
      document.getElementById("lobbyView").classList.remove("hidden");
      document.getElementById("walletView").classList.add("hidden");
      document.getElementById("adminView").classList.add("hidden");
      toast(result.message);
    } else toast(result.message);
  };
  document.getElementById("demoBtn").onclick = () => {
    currentUser = { name: "Demo", phone: "demo_" + Date.now(), balance: 100, refCode: "DEMO", wins: 0, totalDeposited: 100 };
    updateBalanceUI(); setupSocket();
    document.getElementById("registerScreen").classList.add("hidden");
    document.getElementById("mainApp").classList.remove("hidden");
    document.getElementById("lobbyView").classList.remove("hidden");
    document.getElementById("walletView").classList.add("hidden");
    document.getElementById("adminView").classList.add("hidden");
    toast("የሙከራ ሂሳብ 100 ብር");
  };
  document.getElementById("createRoomBtn").onclick = () => { if (!socket) setupSocket(); setTimeout(() => socket.emit('createRoom', { playerName: currentUser.name, phone: currentUser.phone }), 100); };
  document.getElementById("joinRoomBtn").onclick = () => {
    const roomId = document.getElementById("roomIdInput").value.trim();
    if (!roomId) { toast("እባክዎ የክፍል ኮድ ያስገቡ"); return; }
    if (!socket) setupSocket();
    setTimeout(() => socket.emit('joinRoom', { roomId, playerName: currentUser.name, phone: currentUser.phone }), 100);
  };
  document.getElementById("startGameBtn").onclick = () => { if (isHost && currentRoomId) socket.emit('startGame', { roomId: currentRoomId }); };
  document.getElementById("claimBingoBtn").onclick = () => { if (gameActive && currentRoomId) socket.emit('claimBingo', { roomId: currentRoomId }); };
  document.getElementById("autoMarkBtn").onclick = () => { autoMark = !autoMark; document.getElementById("autoMarkBtn").innerText = autoMark ? "✅ አውቶ" : "✋ እጅ"; renderBoard(); };
  document.getElementById("depositBtn").onclick = async () => {
    const amount = parseFloat(document.getElementById("depositAmount").value);
    const reference = document.getElementById("depositRef").value.trim();
    if (isNaN(amount) || amount < 100 || amount > 10000) { toast("ከ100 እስከ 10,000 ብር"); return; }
    if (!reference) { toast("እባክዎ የቴሌብር ማጣቀሻ ቁጥር ያስገቡ"); return; }
    const result = await deposit(currentUser.phone, amount, reference);
    if (result.success) toast(result.message);
    else toast(result.message);
  };
  document.getElementById("withdrawBtn").onclick = async () => {
    const amount = parseFloat(document.getElementById("withdrawAmount").value);
    const pin = document.getElementById("withdrawPin").value;
    const withdrawPhone = document.getElementById("withdrawPhone").value.trim();
    if (isNaN(amount) || amount < 100 || amount > 10000) { toast("ከ100 እስከ 10,000 ብር"); return; }
    if (!withdrawPhone) { toast("የሚወጣበት ስልክ ያስፈልጋል"); return; }
    const result = await withdraw(currentUser.phone, amount, pin, withdrawPhone);
    if (result.success) { currentUser.balance = result.newBalance; updateBalanceUI(); toast(result.message); }
    else toast(result.message);
  };
  document.getElementById("leaveLobbyBtn").onclick = () => { if (currentRoomId) socket.emit('leaveRoom', { roomId: currentRoomId }); window.location.reload(); };
  document.getElementById("leaveGameBtn").onclick = () => { if (currentRoomId) socket.emit('leaveRoom', { roomId: currentRoomId }); window.location.reload(); };
  
  // ታብ መቀየሪያ
  document.getElementById("tabLobbyBtn").onclick = () => {
    document.getElementById("lobbyView").classList.remove("hidden");
    document.getElementById("walletView").classList.add("hidden");
    document.getElementById("adminView").classList.add("hidden");
    document.getElementById("tabLobbyBtn").classList.add("active");
    document.getElementById("tabWalletBtn").classList.remove("active");
    document.getElementById("tabAdminBtn").classList.remove("active");
  };
  document.getElementById("tabWalletBtn").onclick = () => {
    document.getElementById("lobbyView").classList.add("hidden");
    document.getElementById("walletView").classList.remove("hidden");
    document.getElementById("adminView").classList.add("hidden");
    document.getElementById("tabLobbyBtn").classList.remove("active");
    document.getElementById("tabWalletBtn").classList.add("active");
    document.getElementById("tabAdminBtn").classList.remove("active");
  };
  document.getElementById("tabAdminBtn").onclick = () => {
    document.getElementById("lobbyView").classList.add("hidden");
    document.getElementById("walletView").classList.add("hidden");
    document.getElementById("adminView").classList.remove("hidden");
    document.getElementById("tabLobbyBtn").classList.remove("active");
    document.getElementById("tabWalletBtn").classList.remove("active");
    document.getElementById("tabAdminBtn").classList.add("active");
  };
  
  // አስተዳዳሪ ፓነል
  document.getElementById("adminLoginBtn").onclick = async () => {
    const adminKey = document.getElementById("adminKeyInput").value;
    if (!adminKey) { toast("Admin Key ያስገቡ"); return; }
    const result = await getPendingDeposits(adminKey);
    if (result.success) {
      const container = document.getElementById("pendingDepositsList");
      container.innerHTML = `<h4>በመጠባበቅ ላይ ያሉ ዲፖዚቶች:</h4>`;
      result.deposits.forEach(dep => {
        const div = document.createElement("div");
        div.className = "glass";
        div.style.padding = "10px";
        div.style.margin = "10px 0";
        div.innerHTML = `<div>📞 ${dep.phone}</div><div>💰 ${dep.amount} ብር</div><div>🔢 ${dep.reference}</div><div>📅 ${new Date(dep.date).toLocaleString()}</div><button class="btn" onclick='verifyDepositAndRefresh("${dep.id}", "${adminKey}")'>✅ አረጋግጥ</button>`;
        container.appendChild(div);
      });
    } else toast("የተሳሳተ ቁልፍ");
  };
  window.verifyDepositAndRefresh = async (depositId, adminKey) => {
    const result = await verifyDeposit(depositId, adminKey);
    if (result.success) {
      toast(result.message);
      if (currentUser && currentUser.phone === result.phone) {
        const userRes = await getUser(currentUser.phone);
        if (userRes.success) { currentUser.balance = userRes.user.balance; updateBalanceUI(); }
      }
      document.getElementById("adminLoginBtn").click();
    } else toast(result.message);
  };
  
  // ቴሌግራም ሚኒ አፕ ስም አውቶ መሙላት
  if (window.Telegram && Telegram.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
    const user = Telegram.WebApp.initDataUnsafe?.user;
    if (user && user.first_name) document.getElementById("regName").value = user.first_name + (user.last_name ? " " + user.last_name : "");
  }
</script>
</body>
</html>
